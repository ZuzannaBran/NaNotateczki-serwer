name: Backend security and deployment tests

on:
  workflow_dispatch:
  # Explicit verification request only, not every normal code push.
  push:
    branches: [main]
    paths:
      - .github/ci/manual_validation_trigger.txt

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Validate Python modules
        run: python -m compileall -q api/app
      - name: Run security regression tests
        working-directory: api
        run: python -m pytest -q tests
      - name: Verify offline canary activation safety
        run: python -m unittest discover -s scripts/tests -p 'test_stage13_canary_activation.py'
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: test-only-password
          APP_DB_PASSWORD: another-test-only-password
          JWT_SECRET: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          BASE_DOMAIN: example.invalid
        run: docker compose -f compose.yaml config --quiet
