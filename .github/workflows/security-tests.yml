name: Backend security and deployment tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Validate Python modules
        run: python -m compileall -q api/app
      - name: Run security regression tests
        working-directory: api
        run: python -m pytest -q tests
      - name: Validate Docker Compose
        env:
          POSTGRES_PASSWORD: test-only-password
          APP_DB_PASSWORD: another-test-only-password
          JWT_SECRET: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          BASE_DOMAIN: example.invalid
        run: docker compose -f compose.yaml config --quiet
